  <main id="main" class="container tool" data-no-i18n>
    <h1>ניהול פניות</h1>
    <div id="ad-status" class="status-line" role="status" hidden></div>

    <section id="ad-login" class="card" hidden>
      <form id="ad-form" class="acc-form" novalidate>
        <div class="field"><label for="ad-pass">סיסמת ניהול</label><input id="ad-pass" type="password" autocomplete="current-password" maxlength="200"></div>
        <div class="form-actions"><button class="btn" type="submit" id="ad-go">כניסה</button></div>
        <div id="ad-err" class="alert" role="alert" hidden></div>
      </form>
    </section>

    <section id="ad-main" hidden>
      <div class="toolbar">
        <div class="chips" role="group" aria-label="סינון">
          <button class="chip" type="button" data-f="new" aria-pressed="true">חדשות <span id="ad-n-new"></span></button>
          <button class="chip" type="button" data-f="closed" aria-pressed="false">טופלו <span id="ad-n-closed"></span></button>
          <button class="chip" type="button" data-f="all" aria-pressed="false">הכל</button>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" id="ad-refresh">רענון</button>
        <button class="btn btn-ghost btn-sm" type="button" id="ad-logout">התנתקות</button>
      </div>
      <ul id="ad-list" class="ad-list"></ul>
      <p class="empty" id="ad-empty" hidden>אין פניות להצגה.</p>
    </section>
  </main>
